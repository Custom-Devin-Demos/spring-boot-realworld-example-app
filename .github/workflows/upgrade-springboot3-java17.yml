name: CI - Upgrade Java 17 + Spring Boot 3

on:
  push:
    branches:
      - 'upgrade/springboot3-java17'
  pull_request:
    branches:
      - 'upgrade/springboot3-java17'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17]

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ github.ref_name }}-java${{ matrix.java }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ github.ref_name }}-java${{ matrix.java }}-
    - name: Build and Test
      run: ./gradlew build
